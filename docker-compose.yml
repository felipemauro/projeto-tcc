# Banco de dados PostgreSQL para desenvolvimento.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: sal-postgres
    environment:
      POSTGRES_USER: sal
      POSTGRES_PASSWORD: sal
      POSTGRES_DB: sal
    ports:
      - "5432:5432"
    volumes:
      - sal-dados:/var/lib/postgresql/data
      - ./docker/criar-banco-teste.sql:/docker-entrypoint-initdb.d/criar-banco-teste.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sal"]
      interval: 5s
      retries: 10

volumes:
  sal-dados:
