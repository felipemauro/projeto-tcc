# Banco de dados PostgreSQL para desenvolvimento.
# Uso: docker compose up -d
services:
  postgres:
    image: postgres:16
    container_name: sali-postgres
    environment:
      POSTGRES_USER: sali
      POSTGRES_PASSWORD: sali
      POSTGRES_DB: sali
    ports:
      - "5432:5432"
    volumes:
      - sali-dados:/var/lib/postgresql/data
      - ./docker/criar-banco-teste.sql:/docker-entrypoint-initdb.d/criar-banco-teste.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sali"]
      interval: 5s
      retries: 10

volumes:
  sali-dados:
